name: Build Blutter on macOS Tahoe

on:
  workflow_dispatch:

jobs:
  build-blutter:
    runs-on: macos-26
    
    steps:
    - name: Checkout blutter
      uses: actions/checkout@v4
      with:
        repository: 'worawit/blutter'
        path: 'blutter'
    
    - name: Install XCode Command Line Tools
      run: |
        sudo xcode-select --install || true
    
    - name: Install required tools via Homebrew
      run: |
        brew update
        brew install cmake ninja pkg-config icu4c capstone
    
    - name: Setup Python virtual environment
      run: |
        python3 -m venv blutter_env
        source blutter_env/bin/activate
        pip install --upgrade pip
        pip install pyelftools requests
    
    - name: Build blutter
      run: |
        # 进入实际的源码目录（blutter 子目录）
        cd blutter/blutter
        source ../../blutter_env/bin/activate
        
        echo "Current directory: $(pwd)"
        echo "Checking for CMakeLists.txt:"
        ls -la | grep -i cmake
        
        # 创建并进入构建目录
        mkdir -p build
        cd build
        
        # 运行 CMake（父目录包含 CMakeLists.txt）
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)
        
        echo "Build artifacts:"
        ls -la
    
    - name: Test blutter
      run: |
        cd blutter/blutter
        source ../../blutter_env/bin/activate
        python3 blutter.py --help || echo "Blutter ready"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blutter-tahoe
        path: |
          ./blutter/blutter/build/blutter
          ./blutter/blutter/build/*.dylib
          ./blutter/blutter/build/*.so
          ./blutter/blutter/blutter.py
          ./blutter/blutter/*.py
        retention-days: 7
