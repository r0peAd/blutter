name: Build Blutter on macOS

on:
  workflow_dispatch:

jobs:
  build-blutter:
    runs-on: macos-26
    
    steps:
    # ============================================
    # 1. 检出 Blutter 源码
    # ============================================
    - name: Checkout blutter
      uses: actions/checkout@v4
      with:
        repository: 'worawit/blutter'
    
    # ============================================
    # 2. 安装系统依赖
    # ============================================
    - name: Install system dependencies
      run: |
        brew update
        brew install cmake ninja pkg-config icu4c capstone
    
    # ============================================
    # 3. 设置 Python 虚拟环境
    # ============================================
    - name: Setup Python virtual environment
      run: |
        python3 -m venv blutter_env
        source blutter_env/bin/activate
        pip install --upgrade pip
        pip install pyelftools requests
    
    # ============================================
    # 4. 下载并设置 Dart SDK
    # ============================================
    - name: Download and setup Dart SDK
      run: |
        ARCH=$(uname -m)
        DART_VERSION="3.5.0"
        
        if [ "$ARCH" = "arm64" ]; then
          DART_URL="https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-macos-arm64-release.zip"
        else
          DART_URL="https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-macos-x64-release.zip"
        fi
        
        curl -L -o dart.zip "$DART_URL"
        unzip dart.zip
        rm dart.zip
        mv dart-sdk dart_sdk
        
        # 复制 dart 为 dartvm（保留原文件）
        cp dart_sdk/bin/dart dart_sdk/bin/dartvm
        chmod +x dart_sdk/bin/dartvm
        
        echo "✅ Dart SDK installed"
        echo "Dart SDK structure:"
        ls -la dart_sdk/
        ls -la dart_sdk/bin/
        ls -la dart_sdk/lib/
    
    # ============================================
    # 5. 🔧 修补 CMakeLists.txt
    # ============================================
    - name: Patch CMakeLists.txt
      run: |
        cd blutter
        
        echo "=== BEFORE PATCH ==="
        head -15 CMakeLists.txt
        
        # 删除 dartvm 检查
        python3 << 'EOF'
        with open('CMakeLists.txt', 'r') as f:
            lines = f.readlines()
        
        new_lines = []
        i = 0
        while i < len(lines):
            if 'if (NOT ${DARTLIB} MATCHES "^dartvm")' in lines[i]:
                while i < len(lines) and 'endif()' not in lines[i]:
                    i += 1
                i += 1
                continue
            new_lines.append(lines[i])
            i += 1
        
        with open('CMakeLists.txt', 'w') as f:
            f.writelines(new_lines)
        print("✅ Python patch applied")
        EOF
        
        echo "=== AFTER PATCH ==="
        head -15 CMakeLists.txt
        
        if grep -q "DARTLIB name should start with" CMakeLists.txt; then
          echo "❌ PATCH FAILED!"
          exit 1
        else
          echo "✅ PATCH SUCCESS!"
        fi
    
    # ============================================
    # 6. 编译 Blutter（修正：DARTLIB 指向 lib 目录）
    # ============================================
    - name: Build blutter
      run: |
        source blutter_env/bin/activate
        cd blutter
        
        # 关键修正：DARTLIB 应该指向 Dart SDK 的 lib 目录，
        # 因为 find_package 需要找到 dartvm 的 CMake 配置文件
        # 但 Dart SDK 没有提供 CMake 配置文件，所以我们需要用另一种方式
        
        # 方法：使用 find_library 或直接链接
        # 这里我们设置 DARTLIB 为 libdart 库的路径
        DART_SDK_PATH=$(pwd)/../dart_sdk
        DARTLIB="${DART_SDK_PATH}/lib/libdart.dylib"
        
        # 如果没有 libdart.dylib，尝试 libdart_vm.dylib
        if [ ! -f "${DARTLIB}" ]; then
          DARTLIB="${DART_SDK_PATH}/lib/libdart_vm.dylib"
        fi
        
        echo "DART_SDK_PATH: ${DART_SDK_PATH}"
        echo "DARTLIB: ${DARTLIB}"
        
        if [ -f "${DARTLIB}" ]; then
          echo "✅ Dart library found: ${DARTLIB}"
          file ${DARTLIB}
        else
          echo "⚠️ No Dart library found, using dartvm executable"
          DARTLIB=$(pwd)/../dart_sdk/bin/dartvm
          echo "DARTLIB: ${DARTLIB}"
        fi
        
        mkdir -p build && cd build
        
        # 设置 CMake 前缀路径，帮助 find_package 查找
        export CMAKE_PREFIX_PATH="${DART_SDK_PATH}:${CMAKE_PREFIX_PATH}"
        
        cmake .. -DCMAKE_BUILD_TYPE=Release -DDARTLIB="${DARTLIB}"
        make -j$(sysctl -n hw.ncpu)
        
        echo "✅ Build completed!"
        ls -la
    
    # ============================================
    # 7. 上传构建产物
    # ============================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blutter-macos
        path: |
          ./blutter/build/blutter
          ./blutter/build/*.dylib
          ./blutter/blutter.py
          ./blutter/*.py
        retention-days: 7
