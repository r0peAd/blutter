name: Build Blutter on macOS Tahoe

on:
  workflow_dispatch:

jobs:
  build-blutter:
    runs-on: macos-26
    
    steps:
    - name: Checkout blutter
      uses: actions/checkout@v4
      with:
        repository: 'worawit/blutter'
        path: 'blutter'
    
    - name: Install XCode Command Line Tools
      run: |
        sudo xcode-select --install || true
    
    - name: Install required tools via Homebrew
      run: |
        brew update
        brew install cmake ninja pkg-config icu4c capstone
    
    - name: Setup Python virtual environment
      run: |
        python3 -m venv blutter_env
        source blutter_env/bin/activate
        pip install --upgrade pip
        pip install pyelftools requests
    
    - name: Build blutter
      working-directory: ./blutter
      run: |
        source ../blutter_env/bin/activate
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)
    
    - name: Test blutter
      working-directory: ./blutter
      run: |
        source ../blutter_env/bin/activate
        python3 blutter.py --help || echo "Blutter built successfully"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blutter-tahoe
        path: |
          ./blutter/build/blutter
          ./blutter/build/*.dylib
          ./blutter/blutter.py
          ./blutter/*.py
          ./blutter_env/  # 可选：包含虚拟环境
        retention-days: 7
