name: Build Blutter on macOS

on:
  workflow_dispatch:

jobs:
  build-blutter:
    runs-on: macos-26
    
    steps:
    # ============================================
    # 1. 检出 Blutter 源码
    # ============================================
    - name: Checkout blutter
      uses: actions/checkout@v4
      with:
        repository: 'worawit/blutter'
    
    # ============================================
    # 2. 安装系统依赖
    # ============================================
    - name: Install system dependencies
      run: |
        brew update
        brew install cmake ninja pkg-config icu4c capstone dart-sdk
    
    # ============================================
    # 3. 验证 Dart 安装
    # ============================================
    - name: Verify Dart installation
      run: |
        echo "=== Dart version ==="
        dart --version
        echo ""
        echo "=== Dart prefix ==="
        DART_PREFIX=$(brew --prefix dart-sdk)
        echo "DART_PREFIX: ${DART_PREFIX}"
        echo ""
        echo "=== Dart lib directory ==="
        ls -la ${DART_PREFIX}/lib/ || echo "No lib directory"
        echo ""
        echo "=== Dart include directory ==="
        ls -la ${DART_PREFIX}/include/ || echo "No include directory"
        echo ""
        echo "=== Finding Dart libraries ==="
        find ${DART_PREFIX} -name "*.a" -o -name "*.dylib" | head -20
        
        # 保存路径
        echo "DART_PREFIX=${DART_PREFIX}" >> $GITHUB_ENV
    
    # ============================================
    # 4. 设置 Python 虚拟环境
    # ============================================
    - name: Setup Python virtual environment
      run: |
        python3 -m venv blutter_env
        source blutter_env/bin/activate
        pip install --upgrade pip
        pip install pyelftools requests
    
    # ============================================
    # 5. 🔧 生成 CMakeLists.txt
    # ============================================
    - name: Generate CMakeLists.txt
      run: |
        cd blutter
        
        cat > CMakeLists.txt << 'EOFCM'
        cmake_minimum_required (VERSION 3.20)
        project(blutter)
        
        # 使用 Homebrew 的 dart-sdk 路径
        set(DART_PREFIX "/opt/homebrew/opt/dart-sdk")
        
        # 查找 Dart 库
        find_library(DART_LIB
          NAMES dart dart_vm
          PATHS 
            ${DART_PREFIX}/lib
            ${DART_PREFIX}/lib/dart
            /usr/local/lib
            /usr/lib
          NO_DEFAULT_PATH
        )
        
        if (NOT DART_LIB)
          message(STATUS "Dart library not found in Homebrew path, trying system paths")
          find_library(DART_LIB
            NAMES dart dart_vm
            PATHS /usr/local/lib /usr/lib
          )
        endif()
        
        if (NOT DART_LIB)
          message(FATAL_ERROR "Dart library not found. Please install Dart with: brew install dart-sdk")
        endif()
        
        message(STATUS "Found Dart library: ${DART_LIB}")
        
        set(BINNAME "blutter")
        set(CMAKE_INSTALL_PREFIX "${PROJECT_SOURCE_DIR}/../bin" CACHE PATH "" FORCE)
        set(CMAKE_CXX_STANDARD 20)
        set(CMAKE_CXX_STANDARD_REQUIRED True)
        set(CMAKE_CXX_EXTENSIONS OFF)
        
        if (CMAKE_CXX_COMPILER_ID STREQUAL "Clang")
          cmake_path(GET CMAKE_CXX_COMPILER PARENT_PATH LLVM_BIN_DIR)
          add_compile_options(-fexperimental-library)
          add_link_options(-fexperimental-library -L${LLVM_BIN_DIR}/../lib/c++ -dead_strip)
        endif()
        
        # 查找 Capstone
        include(FindPkgConfig)
        pkg_search_module(CAPSTONE REQUIRED capstone)
        link_directories(${CAPSTONE_LIBDIR})
        include_directories(AFTER ${CAPSTONE_INCLUDEDIR})
        
        # 添加源文件
        set(SRCDIR "src")
        include(sourcelist.cmake)
        list(TRANSFORM SRCS PREPEND "${SRCDIR}/")
        add_executable(${BINNAME} ${SRCS})
        
        # 链接 Dart 库和 Capstone
        target_link_libraries(${BINNAME} PRIVATE ${DART_LIB} capstone)
        
        # 添加 Dart 头文件目录
        target_include_directories(${BINNAME} PRIVATE ${DART_PREFIX}/include)
        
        target_precompile_headers(${BINNAME} PRIVATE "${SRCDIR}/pch.h")
        
        # 编译选项
        set(cc_opts
          -O3 -fno-rtti
          -fvisibility=hidden -fvisibility-inlines-hidden -fno-omit-frame-pointer
        )
        
        # 定义宏
        get_filename_component(FRIDA_TEMPLATE_DIR "${PROJECT_SOURCE_DIR}/../scripts/" ABSOLUTE)
        set(defines NDEBUG FRIDA_TEMPLATE_DIR="${FRIDA_TEMPLATE_DIR}")
        if (OLD_MAP_SET_NAME)
          set(defines ${defines} OLD_MAP_SET_NAME)
          if (OLD_MAP_NO_IMMUTABLE)
            set(defines ${defines} OLD_MAP_NO_IMMUTABLE)
          endif()
        endif()
        if (NO_LAST_INTERNAL_ONLY_CID)
          set(defines ${defines} NO_LAST_INTERNAL_ONLY_CID)
        endif()
        if (HAS_SHARED_CLASS_TABLE)
          set(defines ${defines} HAS_SHARED_CLASS_TABLE)
        endif()
        if (HAS_TYPE_REF)
          set(defines ${defines} HAS_TYPE_REF)
        endif()
        if (HAS_RECORD_TYPE)
          set(defines ${defines} HAS_RECORD_TYPE)
        endif()
        if (NO_INIT_LATE_STATIC_FIELD)
          set(defines ${defines} NO_INIT_LATE_STATIC_FIELD)
        endif()
        if (NO_CODE_ANALYSIS)
          set(defines ${defines} NO_CODE_ANALYSIS)
        endif()
        if (NO_METHOD_EXTRACTOR_STUB)
          set(defines ${defines} NO_METHOD_EXTRACTOR_STUB)
        endif()
        if (UNIFORM_INTEGER_ACCESS)
          set(defines ${defines} UNIFORM_INTEGER_ACCESS)
        endif()
        target_compile_definitions(${BINNAME} PRIVATE ${defines})
        target_compile_options(${BINNAME} PRIVATE ${cc_opts})
        
        cmake_path(SET DST_DIR NORMALIZE "${PROJECT_SOURCE_DIR}/../bin")
        install (TARGETS ${BINNAME} RUNTIME DESTINATION ${DST_DIR})
        EOFCM
        
        echo "✅ CMakeLists.txt generated"
        echo "=== CMakeLists.txt (first 25 lines) ==="
        head -25 CMakeLists.txt
    
    # ============================================
    # 6. 编译 Blutter
    # ============================================
    - name: Build blutter
      run: |
        source blutter_env/bin/activate
        cd blutter
        
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)
        
        echo "✅ Build completed!"
        ls -la
    
    # ============================================
    # 7. 验证构建产物
    # ============================================
    - name: Verify build
      run: |
        cd blutter/build
        if [ -f "blutter" ]; then
          echo "✅ blutter binary found!"
          file blutter
          ls -lh blutter
        else
          echo "❌ blutter binary not found!"
          ls -la
          exit 1
        fi
    
    # ============================================
    # 8. 上传构建产物
    # ============================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blutter-macos
        path: |
          ./blutter/build/blutter
          ./blutter/build/*.dylib
          ./blutter/blutter.py
          ./blutter/*.py
        retention-days: 7
